name: GlamourGlow CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: 1. CI - Build & Test Exec
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: glamourglow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Inizializzazione Schema PostgreSQL
        run: |
          SQL_FILE=$(find . -maxdepth 3 -name "*.sql" | head -n 1)
          if [ -n "$SQL_FILE" ]; then
            echo "Esecuzione dello script SQL: $SQL_FILE"
            PGPASSWORD=postgrespassword psql -h localhost -U postgres -d glamourglow -f "$SQL_FILE"
          else
            echo "Nessun file .sql trovato per l'inizializzazione"
          fi

      - name: Build e test con Maven
        run: mvn -B clean verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/glamourglow
          DB_USER: postgres
          DB_PASSWORD: postgrespassword

      - name: Archiviazione Report dei Test Surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

  package-and-deliver:
    name: 2. CD - Generazione Artefatto WAR
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Generazione pacchetto WAR
        run: mvn -B package -DskipTests

      - name: Caricamento dell'Artefatto .WAR
        uses: actions/upload-artifact@v4
        with:
          name: GlamourGlow-v1.0.0-war
          path: target/*.war
