name: GlamourGlow CI/CD Pipeline

on:
  push:
    branches: [ "main", "feature/**" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------
  # FASE 1: Continuous Integration (CI) - Build & Test
  # -------------------------------------------------------------
  test:
    name: CI - Build e Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ecommerce
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Installazione client PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Inizializzazione Schema e Dati PostgreSQL
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE ROLE runner WITH LOGIN SUPERUSER;" || true
          PGPASSWORD=postgres psql -h localhost -U postgres -d ecommerce -f src/main/resources/schema.sql
          if [ -f "src/main/resources/data.sql" ]; then
            PGPASSWORD=postgres psql -h localhost -U postgres -d ecommerce -f src/main/resources/data.sql
          fi

      - name: Esecuzione Build e Test con Maven
        run: >-
          mvn -B clean verify -DskipITs -e
          -Ddb.user=postgres
          -Ddb.password=postgres
          -Ddb.url=jdbc:postgresql://localhost:5432/ecommerce
          -Djdbc.username=postgres
          -Djdbc.password=postgres
        env:
          DB_URL: jdbc:postgresql://localhost:5432/ecommerce
          DB_USER: postgres
          DB_PASSWORD: postgres
          MAVEN_OPTS: "-XX:+EnableDynamicAgentLoading"

      - name: Salva Report dei Test se fallisce
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  # -------------------------------------------------------------
  # FASE 2: Continuous Delivery (CD) - Docker Build & Push
  # -------------------------------------------------------------
  deploy:
    name: CD - Build & Push Docker Image
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Estrattore Metadati Docker (Semantic Versioning)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/glamourglow
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e Push dell'immagine Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}