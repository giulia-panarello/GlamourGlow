name: GlamourGlow CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: 1. CI - Build & Test Exec
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ecommerce
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Installazione client PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Inizializzazione Schema e Dati PostgreSQL
        run: |
          echo "Inizializzazione database ecommerce..."
          PGPASSWORD=postgres psql -h localhost -U postgres -d ecommerce -f src/main/resources/schema.sql
          if [ -f "src/main/resources/data.sql" ]; then
            PGPASSWORD=postgres psql -h localhost -U postgres -d ecommerce -f src/main/resources/data.sql
          fi

      - name: Build e test con Maven
        run: mvn -B clean verify -e
        env:
          DB_URL: jdbc:postgresql://localhost:5432/ecommerce
          DB_USER: postgres
          DB_PASSWORD: postgres
          MAVEN_OPTS: "-XX:+EnableDynamicAgentLoading"

      - name: Salva Report dei Test se fallisce
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/