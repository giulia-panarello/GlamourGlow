name: GlamourGlow CI/CD Pipeline

on:
  push:
    branches: [ "main", "feature/**" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  test:
    name: CI - Build e Test
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ecommerce
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v5

      - name: Configurazione JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Installazione client PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Inizializzazione Schema e Dati PostgreSQL
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE ROLE runner WITH LOGIN SUPERUSER;" || true
          PGPASSWORD=postgres psql -h localhost -U postgres -d ecommerce -f src/main/resources/schema.sql
          if [ -f "src/main/resources/data.sql" ]; then
            PGPASSWORD=postgres psql -h localhost -U postgres -d ecommerce -f src/main/resources/data.sql
          fi


      - name: Esecuzione Build e Test con Maven
        run: mvn -B clean verify -DskipITs -e
        env:
          MAVEN_OPTS: "-XX:+EnableDynamicAgentLoading"


      - name: Salvataggio pacchetto WAR per la fase di CD
        uses: actions/upload-artifact@v7
        with:
          name: app-war
          path: target/*.war
          retention-days: 1

      - name: Salva Report dei Test se fallisce
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/


  deploy:
    name: CD - Build & Push Docker Image
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v5

      - name: Download pacchetto WAR dal job CI
        uses: actions/download-artifact@v7
        with:
          name: app-war
          path: target/

      - name: Autenticazione Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build e Push Immagine Docker
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/glamourglow"
          
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker build -t "$IMAGE:latest" .
            docker push "$IMAGE:latest"
          fi
          
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            docker build -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .
            docker push "$IMAGE:$VERSION"
            docker push "$IMAGE:latest"
          fi